<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayanna Tamez</title>
</head>
<body>
    <style>
      
        *{
            box-sizing: border-box;
        }
        :root{
            --primary-color: rgb(146, 143, 136);
            --secundary-color: rgba(234, 247, 191, 0.192);
            --terceary-color: rgb(247, 243, 240);
            --color-cuarto: rgba(109, 109, 109, 0.973);
            --color-quinto: rgb(0, 0, 0);
        }
        body{
            background-color: var(--primary-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        header{
            padding: 15px;
            display: flex;
            justify-content: flex-end;
            background-color: var(--color-cuarto);
        }
        .search{
            background-color: var(--primary-color);
            border: 5px solid var(--terceary-color);
            border-radius: 50px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 15px;
            padding: 10px 16px;
            color: var(--terceary-color);
        }
        .search::placeholder{
            color: var(--color-quinto);
        }
        .search:focus{
            outline: none;
            background-color: var(--color-cuarto);
        }
        main{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .personaje{
            width: 400px;
            margin: 15px;
            background-color: var(--color-cuarto);
            box-shadow: 10 15px 1px var(--secundary-color);
            position: relative;
            overflow: hidden;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }
        .personaje img{
            width: 80%;
            height: 400px;
            object-fit: contain;

        }
        .personaje-info{
            color: var(--color-quinto);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 0.8px 15px 15px;
            letter-spacing: 5px;
        }
        .personaje-info h3{
            color: var(--primary-color);
            margin-top: 0;
        }
        .personaje-info h1{
            color: var(--terceary-color);
            margin-top: 0;
        }
     
        .descripcion {
            background-color: var(--secundary-color);
            padding: 15px;
            position: absolute;
            left: 0;
            bottom: 0;
            right: 0;
            max-height: 100%;
            transform: translateY(101%);
            overflow-y: auto;
            transition: transform 1s ease-in;
        }
        .personaje:hover .descripcion {
            transform: translateY(0);
        }
    </style>

    
<header>
    <img src="snoopy.jpg" alt="logo" style="width: 70px; height: 50px;">
    <form id="form">
        <input type="text" id="search" class="search" placeholder="Busca tu personaje">
    </form>
</header>

<main id="main"></main>

<script>
    const API_URL1 = 'https://hp-api.onrender.com/api/characters';
    const API_URL2 = 'https://rickandmortyapi.com/api/character';

    const main = document.getElementById('main');
    const form = document.getElementById('form');
    const search = document.getElementById('search');

    getAllCharacters();

    async function getAllCharacters(url){
        const [rickRes, hpRes] = await Promise.all([
       fetch(API_URL2).then(res => res.json()),
       fetch(API_URL1).then(res => res.json())
    ]);

        const rickChars = rickRes.results || [];
        const hpChars = hpRes || [];

        showCharacters([...rickChars, ...hpChars]);
    }
    function showCharacters(characters){
        main.innerHTML = '';
        characters.forEach((char) => {


            const {id, name, image, species, gender,  house, actor, yearOfBirth, dateOfBirth, eyeColour} = char;
            const charElements = document.createElement('div');
            charElements.classList.add('personaje');
            charElements.innerHTML = `
            <img src = "${image}" alt="${name}">
            <div class="personaje-info"> 
                <h1>${name}</h1>
                <h3>${yearOfBirth}</h3>
               <br>
               ${species}
                    </div>
                    <div class = "descripcion">
                        <h3>Descripcion</h3>
                        <p><strong>Genero:</strong> ${gender}</p>
                        <p><strong>Hogar:</strong> ${house}</p>
                        <p><strong>Fecha de Nacimiento:</strong> ${dateOfBirth}</p>
                        <p><strong>Color de Ojos:</strong> ${eyeColour}</p>
                        <p>${actor || "sin actor disponible"}</p>

                    </div>`
                main.appendChild(charElements);
        })}
      
            form.addEventListener('submit', (e) => {
                e.preventDefault()
                const searchTerm = search.value.toLowerCase();
                if(searchTerm && searchTerm !== ''){
                    getCharacters(API_URL1 + `?name=${searchTerm}`)
                    search.value='';
                }else{
                    window.location.reload();
                }
            })
</script>

</body>
</html>
